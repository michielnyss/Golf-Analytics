/* ══ Yardage book ═══════════════════════════════════════════════════════════
   Prints the hole cards you have been looking at. Everything the map shows is
   whatever is toggled on screen — focus, rings, shots, pins, satellite, units —
   so the way to personalise the book is to set the viewer up the way you want
   it and then open this. The bar only owns what is specific to paper.

   Each card is drawn by the ordinary drawHole(), onto an offscreen canvas the
   size of the printed map at 300dpi, and captured as a JPEG. Rendering the real
   thing rather than re-implementing it for print means the two cannot drift. */

const MM_PX = 96 / 25.4;          // CSS px per mm, by definition
const BOOK_DPI = 300;
const BOOK_CSS_H = 760;           // CSS px per card: sets text size *relative* to the card
const BOOK_MAX_DPR = 4;

const PAGES = {
  A6:     { w: 105,   h: 148,   m: 5  },
  A5:     { w: 148,   h: 210,   m: 8  },
  A4:     { w: 210,   h: 297,   m: 12 },
  Letter: { w: 215.9, h: 279.4, m: 12 },
  Pocket: { w: 101.6, h: 152.4, m: 5  },
};

const BOOK = { size: 'A6', per: 1, margin: 5, light: true, gray: false, top: false };
// A render takes a couple of seconds, so a setting changed during one is
// remembered and re-rendered rather than dropped.
let BOOK_BUSY = false, BOOK_AGAIN = false;

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* Paper -> the boxes on it, all in mm. A6 with its default margin is the
   baseline the ribbon's type scales off.

   How many cards fit, and which way up the paper goes. A hole card is a tall
   0.62, so the grid is chosen to keep each cell roughly that shape — and each
   grid is one you would guillotine the sheet along anyway:

     2-up  turns the paper landscape and splits it down the middle: two portrait
           cells side by side. Portrait paper would squeeze each to half height.
     4-up  keeps the paper portrait and quarters it. Halving both sides leaves a
           cell the same shape as the sheet, so the card keeps its proportions —
           an A4 quarter is an A6, which is the one-up page.                   */
const BOOK_UP = {
  1: { cols: 1, rows: 1, land: false },
  2: { cols: 2, rows: 1, land: true  },
  4: { cols: 2, rows: 2, land: false },
};
const BOOK_GAP = 1.6;      // mm between map and ribbon
const BOOK_SLACK = 0.4;    // mm held back, so rounding cannot spill a page

function bookGeom() {
  const p = PAGES[BOOK.size], m = clamp(BOOK.margin, 0, 25);
  const up = BOOK_UP[BOOK.per] || BOOK_UP[1];
  const w = up.land ? p.h : p.w, h = up.land ? p.w : p.h;
  const cw = w - 2 * m, ch = h - 2 * m;
  /* The margin doubles as the gutter, so a cut leaves each card its own margin
     back — trimmed cards from a 4-up sheet look like the 1-up page. */
  const cardW = (cw - (up.cols - 1) * m) / up.cols;
  const cellH = (ch - (up.rows - 1) * m) / up.rows;
  return { w, h, m, land: up.land, cols: up.cols, rows: up.rows,
           cw, ch, cardW, cellH, scale: clamp(cardW / 93, 0.8, 2.2) };
}

/* @page cannot read custom properties in Chrome, so the rule is rewritten. */
function setPageCSS() {
  const g = bookGeom();
  document.getElementById('pageCSS').textContent =
    `@page { size: ${g.w}mm ${g.h}mm; margin: ${g.m}mm; }`;
}

/* The printed ribbon under each card: the four numbers you actually want in your
   back pocket. The length is headed by the tee it is for, so a printed book says
   which markers it was made for without a legend. */
function ribbonHTML(h) {
  const tee = h._teeOpts[teeIdxOfSet(h)] || h._teeOpts[0];
  const len = holeLen(h);
  const toPin = tee && tee.card_m == null && tee.kind === 'played' && tee.to_pin_m != null;
  const head = tee && tee.card_m != null ? esc(tee.label) : toPin ? 'To pin' : 'To green';
  const depth = h._greenLo != null ? fmt(h._greenHi - h._greenLo) : '—';
  const cell = (k, v) => `<div class="c"><span class="k">${k}</span><span class="v">${v}</span></div>`;
  return `<div class="ribbon">
    <div class="no">${h.num}</div>
    <div class="cells">
      ${cell('Par', h.par ?? '—')}
      ${h.si != null ? cell('SI', h.si) : ''}
      ${cell(head, fmt(len))}
      ${cell('Green', depth)}
      ${h.si != null ? '' : cell('From', esc(tee ? tee.label : '—'))}
    </div>
  </div>`;
}

/* Lay the book out, then measure the ribbon — it is type-sized, so only the DOM
   knows how tall it came out — and give the map every millimetre that is left. */
function bookSkeleton() {
  const g = bookGeom();
  const book = document.getElementById('book');
  const set = (k, v) => book.style.setProperty(k, v);
  set('--pw', g.w + 'mm');
  set('--ph', g.h + 'mm');
  set('--pm', g.m + 'mm');
  set('--cw', g.cw + 'mm');
  set('--ch', g.ch + 'mm');
  set('--cols', String(g.cols));
  set('--rows', String(g.rows));
  set('--gap', BOOK_GAP + 'mm');
  set('--rib-no', (5.4  * g.scale).toFixed(2) + 'mm');
  set('--rib-k',  (1.75 * g.scale).toFixed(2) + 'mm');
  set('--rib-v',  (3.05 * g.scale).toFixed(2) + 'mm');

  const cards = COURSE.holes.map((h, i) =>
    `<div class="card${BOOK.top ? ' rib-top' : ''}">
       <img data-hole="${i}" alt="Hole ${h.num}">
       ${ribbonHTML(h)}
     </div>`);

  const cut = (g.cols > 1 ? ' cut-v' : '') + (g.rows > 1 ? ' cut-h' : '');
  let sheets = '';
  for (let i = 0; i < cards.length; i += BOOK.per) {
    sheets += `<div class="paper"><div class="sheet${cut}">`
            + cards.slice(i, i + BOOK.per).join('')
            + `</div></div>`;
  }
  book.innerHTML = sheets;

  /* Fit the PAGE_AR map into what the ribbon leaves, then shrink the card onto
     it — whichever of height or width binds. */
  const ribH = book.querySelector('.ribbon').getBoundingClientRect().height / MM_PX;
  const availH = Math.max(20, g.cellH - ribH - BOOK_GAP - BOOK_SLACK);
  g.mapW = Math.min(g.cardW, availH * PAGE_AR);
  g.mapH = g.mapW / PAGE_AR;
  set('--card-w', g.mapW.toFixed(2) + 'mm');
  set('--map-h', g.mapH.toFixed(2) + 'mm');
  return g;
}

/* Satellite imagery is fetched lazily, so a card can be drawn before its aerial
   has decoded. Wait for the ones we are about to need. */
function bookAwaitSat() {
  if (!S.sat) return Promise.resolve();
  const pending = COURSE.holes.map(h => h._sat).filter(im => im && !im.complete);
  if (!pending.length) return Promise.resolve();
  return Promise.race([
    Promise.all(pending.map(im => new Promise(r => { im.onload = im.onerror = r; }))),
    new Promise(r => setTimeout(r, 8000)),
  ]);
}

function greyscale(c) {
  const g = c.getContext('2d');
  const d = g.getImageData(0, 0, c.width, c.height), px = d.data;
  for (let i = 0; i < px.length; i += 4) {
    const y = 0.2126 * px[i] + 0.7152 * px[i + 1] + 0.0722 * px[i + 2];
    px[i] = px[i + 1] = px[i + 2] = y;
  }
  g.putImageData(d, 0, 0);
}

async function renderBook() {
  if (BOOK_BUSY) { BOOK_AGAIN = true; return; }
  BOOK_BUSY = true;
  const note = document.getElementById('bkNote');
  document.getElementById('bkPrint').disabled = true;
  const g = bookSkeleton();
  setPageCSS();

  const imgs = [...document.querySelectorAll('#book img')];
  /* The map box is already PAGE_AR, so its height sets the render size: 300dpi
     across it, capped — an A4 card would otherwise want a 40-megapixel canvas. */
  const devH = Math.min(3400, Math.round(g.mapH * BOOK_DPI / 25.4));
  const dpr  = clamp(devH / BOOK_CSS_H, 1, BOOK_MAX_DPR);
  const cssH = Math.round(devH / dpr), cssW = Math.round(cssH * PAGE_AR);

  note.textContent = 'rendering…';
  await bookAwaitSat();

  const off = document.createElement('canvas');
  off.style.cssText = `position:fixed;left:-99999px;top:0;width:${cssW}px;height:${cssH}px`;
  document.body.appendChild(off);

  const was = { view: S.view, hole: S.hole, zoom: S.zoom, pan: { ...S.pan },
                measure: S.measure, teeIdx: S.teeIdx,
                theme: document.documentElement.dataset.theme };
  cv = off; ctx = off.getContext('2d');
  PRINT_DPR = dpr;
  PRINT_FIT = 0.998;                       // fill the card; the hairline frame is its border
  if (BOOK.light) document.documentElement.dataset.theme = 'light';
  S.view = 'hole'; S.measure = null; S.zoom = 1; S.pan = { x: 0, y: 0 };

  try {
    for (const img of imgs) {
      S.hole = +img.dataset.hole;
      S.teeIdx = teeIdxOfSet(COURSE.holes[S.hole]);   // every card drawn off the chosen set
      draw();
      if (BOOK.gray) greyscale(off);
      img.src = off.toDataURL('image/jpeg', 0.92);
      note.textContent = `rendering… ${S.hole + 1}/${imgs.length}`;
      await new Promise(r => setTimeout(r, 0));   // let the page breathe
    }
  } finally {
    off.remove();
    cv = SCREEN_CV; ctx = cv.getContext('2d');
    PRINT_DPR = PRINT_FIT = null;
    Object.assign(S, { view: was.view, hole: was.hole, zoom: was.zoom,
                       pan: was.pan, measure: was.measure, teeIdx: was.teeIdx });
    if (was.theme) document.documentElement.dataset.theme = was.theme;
    else delete document.documentElement.dataset.theme;
    BOOK_BUSY = false;
    document.getElementById('bkPrint').disabled = false;
    refresh();
  }

  const sheets = document.querySelectorAll('#book .paper').length;
  note.textContent = `${imgs.length} holes · ${sheets} sheet${sheets > 1 ? 's' : ''} · `
    + `${BOOK.size}${g.land ? ' landscape' : ''} · ${Math.round(devH * 25.4 / g.mapH)}dpi`;

  if (BOOK_AGAIN) { BOOK_AGAIN = false; return renderBook(); }
}

/* Returns when every card is drawn — `#book` plus headless Chrome's
   --print-to-pdf can then export the whole book without a click:
     chrome --headless --print-to-pdf=book.pdf --virtual-time-budget=60000 \
            --no-pdf-header-footer "yardage_20625.html#book"              */
function openBook() {
  document.getElementById('bookWrap').hidden = false;
  return (window.bookReady = renderBook());
}
function closeBook() {
  document.getElementById('bookWrap').hidden = true;
  document.getElementById('book').innerHTML = '';   // drop the data URLs
}

{
  const bind = (id, prop, read, rerender = true) => {
    const el = document.getElementById(id);
    el.addEventListener('change', () => {
      BOOK[prop] = read(el);
      if (prop === 'size') { BOOK.margin = PAGES[BOOK.size].m; syncBookBar(); }

  bind('bkSize',   'size',   el => el.value);

  bind('bkTop',    'top',    el => el.checked);

  document.getElementById('bookBtn').onclick  = openBook;

}

function syncBookBar() {
  document.getElementById('bkSize').value   = BOOK.size;
  document.getElementById('bkPer').value    = String(BOOK.per);
  document.getElementById('bkMargin').value = BOOK.margin;
  document.getElementById('bkLight').checked = BOOK.light;

}

/* ══ Analysis ═══════════════════════════════════════════════════════════════
   Reads the same COURSE the map draws, so the two can never disagree about
   what you played. A *play* is one hole in one round; every number on the tab
   is a fold over a filtered list of them.

   Colour does two jobs and no more: one blue wherever the question is "how
   much", and a blue↔red scale pivoting on grey wherever it is "how far from
   par" — par being the nothing the scale turns on. The map's amber and cyan
   are left alone; they already mean "from the tee" and "to the green" one tab
   away, and spending them on a series here would say something untrue.        */

const PUTTER = 'Putter';
const SCORE_NAME  = ['Eagle or better', 'Birdie', 'Par', 'Bogey', 'Double bogey', 'Triple+'];
const SCORE_SHORT = ['Eagle+', 'Birdie', 'Par', 'Bogey', 'Double', 'Triple+'];
const SCORE_VAR   = ['--sc-eagle', '--sc-birdie', '--sc-par', '--sc-bogey', '--sc-double', '--sc-triple'];
const bucket = (score, par) => {
  const d = score - par;
  return d <= -2 ? 0 : d === -1 ? 1 : d === 0 ? 2 : d === 1 ? 3 : d === 2 ? 4 : 5;
};

/* Lies in the order you meet them; anything else falls to the end. */
const LIE_ORDER = ['tee', 'fairway', 'rough', 'bunker', 'water', 'green'];
/* Shot Scope writes a missing lie three ways — absent, '0' and 'unknown'. They
   are one thing, and folding them here keeps them one column. */
const lieKey = k => !k || k === '0' || k === 'unknown' ? 'unknown' : k;
const lieName = k => LIE_NAME[{ tee:'t', fairway:'f', green:'g', bunker:'b', water:'w', rough:'r' }[k]]
  || (k === 'unknown' ? 'Unrecorded' : k);

const sgn = (v, d = 1) => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(d);
const pctTxt = (a, b) => b ? Math.round(100 * a / b) + '%' : '—';
const dateTxt = s => {
  const d = new Date(s + 'T00:00:00');
  return isNaN(d) ? s : d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
};
const dateShort = s => {
  const d = new Date(s + 'T00:00:00');
  return isNaN(d) ? s : d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
};
const quant = (sorted, q) => {
  if (!sorted.length) return null;
  const i = (sorted.length - 1) * q, lo = Math.floor(i), hi = Math.ceil(i);
  return sorted[lo] + (sorted[hi] - sorted[lo]) * (i - lo);
};

/* ── The play list ──────────────────────────────────────────────────────────
   Built once per course, cached on it. Fairways are carried across from the
   library entry rather than re-derived: Shot Scope's own count is not
   reproducible from the exported fields, and the dashboard should agree with
   the app the data came from. Everything hole-level is derived here. */
function analysis() {
  if (COURSE._an) return COURSE._an;
  const meta = (APP.library || []).find(m => m.id === COURSE.courseID) || {};
  const rmeta = new Map((meta.rounds || []).map(r => [r.id, r]));

  const plays = [];
  for (const h of COURSE.holes) {
    const byRound = new Map();
    for (const s of h.shots) {
      if (!byRound.has(s.roundID)) byRound.set(s.roundID, []);
      byRound.get(s.roundID).push(s);
    }
    for (const [rid, list] of byRound) {
      list.sort((a, b) => a.shot - b.shot);
      const scored = list.find(s => s.score != null);
      if (!scored) continue;
      // Green in regulation: on the putting surface with two strokes left for
      // par. `shot` numbers the stroke that ended there, so it is the count.
      const reach = list.find(s => s.toLie === 'green');
      plays.push({
        rid, date: (rmeta.get(rid) || {}).date || list[0].date,
        num: h.num, par: h.par, si: h.si ?? null,
        score: scored.score, toPar: scored.score - h.par,
        putts: list.filter(s => s.club === PUTTER).length,
        gir: !!reach && reach.shot <= h.par - 2,
        shots: list,
      });
    }
  }
  plays.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.num - b.num);

  const rounds = [];
  for (const p of plays) {
    let r = rounds.find(x => x.id === p.rid);
    if (!r) rounds.push(r = { ...(rmeta.get(p.rid) || {}), id: p.rid, date: p.date, plays: [] });
    r.plays.push(p);
  }
  return COURSE._an = { plays, rounds, meta };
}

const scopedPlays  = () => S.round === 'all' ? analysis().plays
  : analysis().plays.filter(p => p.rid === +S.round);
const scopedRounds = () => S.round === 'all' ? analysis().rounds
  : analysis().rounds.filter(r => r.id === +S.round);

function agg(plays) {
  const a = { n: plays.length, mix: [0, 0, 0, 0, 0, 0], strokes: 0, par: 0,
              putts: 0, gir: 0, scr: 0, scrN: 0, three: 0, one: 0 };
  for (const p of plays) {
    a.mix[bucket(p.score, p.par)]++;
    a.strokes += p.score; a.par += p.par; a.putts += p.putts;
    if (p.gir) a.gir++; else { a.scrN++; if (p.toPar <= 0) a.scr++; }
    if (p.putts >= 3) a.three++;
    if (p.putts === 1) a.one++;
  }
  a.toParPerHole = a.n ? (a.strokes - a.par) / a.n : 0;
  a.puttsPerHole = a.n ? a.putts / a.n : 0;
  return a;
}

function firOf(rounds) {
  let hit = 0, n = 0, any = false;
  for (const r of rounds) if (r.fir != null) { hit += r.fir; n += r.firN; any = true; }
  return any && n ? { hit, n, pct: 100 * hit / n } : null;
}

function clubStats(plays) {
  const m = new Map();
  for (const p of plays) for (const s of p.shots) {
    if (s.club === PUTTER || !s.distance_m) continue;   // 0 m is a drop, not a strike
    if (!m.has(s.club)) m.set(s.club, { club: s.club, short: s.club_short || s.club, d: [], tee: 0 });
    const c = m.get(s.club);
    c.d.push(s.distance_m);
    if (s.lie === 'tee') c.tee++;
  }
  return [...m.values()].map(c => {
    c.d.sort((a, b) => a - b);
    c.n = c.d.length;
    c.p25 = quant(c.d, .25); c.p50 = quant(c.d, .5); c.p75 = quant(c.d, .75);
    c.max = c.d[c.d.length - 1];
    return c;
  }).sort((a, b) => b.p50 - a.p50);
}

function lieMatrix(plays) {
  const rows = new Map(), cols = new Set();
  for (const p of plays) for (const s of p.shots) {
    const from = lieKey(s.lie), to = lieKey(s.toLie);
    if (!rows.has(from)) rows.set(from, new Map());
    rows.get(from).set(to, (rows.get(from).get(to) || 0) + 1);
    cols.add(to);
  }
  const ord = k => { const i = LIE_ORDER.indexOf(k); return i < 0 ? 99 : i; };
  return {
    rows: [...rows.keys()].sort((a, b) => ord(a) - ord(b)),
    cols: [...cols].sort((a, b) => ord(a) - ord(b)),
    at: (r, c) => rows.get(r)?.get(c) || 0,
    sum: r => [...rows.get(r).values()].reduce((x, y) => x + y, 0),
  };
}

/* ── Chart plumbing ─────────────────────────────────────────────────────────
   Plain inline SVG on a nominal viewBox, scaled to the card by CSS. Marks stay
   thin, the data end of a bar is rounded 4 and the baseline end is square, and
   fills are separated by 2 units of surface rather than by a stroke. */
/* A chart is drawn on a viewBox roughly the width it will be shown at, so the
   browser is not scaling 9px type down to 5px to fit a half-width card. */
const W_HALF = 430, W_FULL = 880;
const vv = n => `var(${n})`;

function capBarV(x, y, w, h, r = 4) {            // grows up from a baseline
  r = Math.max(0, Math.min(r, w / 2, h));
  return `M${x} ${y + h}V${y + r}q0 ${-r} ${r} ${-r}h${w - 2 * r}q${r} 0 ${r} ${r}V${y + h}Z`;
}
function capBarD(x, y, w, h, r = 4) {            // …and down from one
  r = Math.max(0, Math.min(r, w / 2, h));
  return `M${x} ${y}v${h - r}q0 ${r} ${r} ${r}h${w - 2 * r}q${r} 0 ${r} ${-r}V${y}Z`;
}
function capBarH(x, y, w, h, r = 4) {            // …and rightward
  r = Math.max(0, Math.min(r, h / 2, w));
  return `M${x} ${y}h${w - r}q${r} 0 ${r} ${r}v${h - 2 * r}q0 ${r} ${-r} ${r}H${x}Z`;
}

/* Every chart ships with the same twin: a table of the identical numbers, one
   toggle away, so no value is locked behind colour or hover. */
let CARD_SEQ = 0;
function chartCard(o) {
  return `<section class="card2" id="c${++CARD_SEQ}"${o.opt ? ` data-optkey="${o.opt}"` : ''}>
    <header>
      <h2>${o.title}</h2>
      ${o.sub ? `<span class="sub">${o.sub}</span>` : ''}
      <span class="grow"></span>
      ${(o.tabs || []).map(t => `<button class="tbtn" data-opt="${esc(t.v)}"
          aria-pressed="${!!t.on}">${esc(t.label)}</button>`).join('')}
      ${o.table ? `<button class="tbtn" data-tv aria-pressed="false"
          title="Show the numbers instead">Table</button>` : ''}
    </header>
    <div class="plot">${o.plot}</div>
    ${o.table ? `<div class="tv">${o.table}</div>` : ''}
    ${o.keys ? `<div class="keys" style="margin-top:9px">${o.keys}</div>` : ''}
    ${o.foot ? `<p class="foot">${o.foot}</p>` : ''}
  </section>`;
}
const scoreKeys = () => SCORE_NAME.map((nm, i) =>
  `<span><i style="background:${vv(SCORE_VAR[i])}"></i>${nm}</span>`).join('');

/* ── Scoring mix ────────────────────────────────────────────────────────────
   An ordered scale of shares, so it is drawn the way ordered shares are: each
   row centred on its own par segment, under-par running left and over-par
   right, on one shared scale. How far a row leans is the whole reading. */
function mixChart(rows, VW = W_HALF) {
  const R = 22, GAP = 8, PAD_L = 54, PAD_R = 10, TOP = 6;
  const H = TOP + rows.length * (R + GAP) + 20;
  const W = VW - PAD_L - PAD_R;

  const share = r => r.mix.map(c => r.n ? 100 * c / r.n : 0);
  const lefts  = rows.map(r => { const s = share(r); return s[0] + s[1] + s[2] / 2; });
  const rights = rows.map(r => { const s = share(r); return s[2] / 2 + s[3] + s[4] + s[5]; });
  const maxL = Math.max(1, ...lefts), maxR = Math.max(1, ...rights);
  const k = W / (maxL + maxR);
  const zero = PAD_L + maxL * k;

  let out = `<svg viewBox="0 0 ${VW} ${H}" role="img"
    aria-label="Share of holes by score relative to par, centred on par">`;
  // The pivot: a hairline at par, and the two directions named under it.
  out += `<line class="ax" x1="${zero}" y1="${TOP - 2}" x2="${zero}" y2="${H - 20}"/>`;
  out += `<text x="${zero - 6}" y="${H - 7}" text-anchor="end">← under par</text>`;
  out += `<text x="${zero + 6}" y="${H - 7}">over par →</text>`;

  rows.forEach((r, ri) => {
    const y = TOP + ri * (R + GAP), s = share(r);
    out += `<text x="${PAD_L - 9}" y="${y + R / 2 + 3.5}" text-anchor="end" class="val">${esc(r.label)}</text>`;
    out += `<text x="${PAD_L - 9}" y="${y + R / 2 + 14}" text-anchor="end">${r.n}</text>`;
    let x = zero - lefts[ri] * k;
    s.forEach((v, i) => {
      const w = v * k;
      if (w > 0.35) {
        const bw = Math.max(1, w - 2);           // 2 units of surface between fills
        out += `<rect x="${x.toFixed(2)}" y="${y}" width="${bw.toFixed(2)}" height="${R}" rx="2"
          fill="${vv(SCORE_VAR[i])}" data-tip="<b>${r.mix[i]}</b> of ${r.n} — ${
          esc(SCORE_NAME[i])} (${Math.round(v)}%)${r.label === 'All holes' ? '' : ' on ' + esc(r.label.toLowerCase())}"/>`;
        // A count only where it fits with air around it; the rest is in the table.
        if (bw > 24) out += `<text class="ink" x="${(x + bw / 2).toFixed(2)}" y="${y + R / 2 + 3.5}"
          text-anchor="middle" fill="${vv(SCORE_VAR[i] + '-ink')}">${r.mix[i]}</text>`;
      }
      x += w;
    });
  });
  return out + '</svg>';
}

/* ── Round by round ─────────────────────────────────────────────────────────
   One measure at a time on one axis. Two measures of different scale would be
   two axes, which is a chart that invents a correlation — so it is a toggle. */
const TREND = {
  toPar:  { label: 'To par',    fmt: v => sgn(v, 2), axis: v => sgn(v, 1),
            of: r => { const a = agg(r.plays); return a.toParPerHole; }, zero: true,
            note: 'strokes over par per hole' },
  putts:  { label: 'Putts',     fmt: v => v.toFixed(2), axis: v => v.toFixed(1),
            of: r => agg(r.plays).puttsPerHole, zero: true,
            note: 'putts per hole' },
  gir:    { label: 'Greens',    fmt: v => Math.round(v) + '%', axis: v => Math.round(v) + '%',
            of: r => { const a = agg(r.plays); return a.n ? 100 * a.gir / a.n : 0; }, zero: true,
            note: 'greens in regulation' },
  fir:    { label: 'Fairways',  fmt: v => Math.round(v) + '%', axis: v => Math.round(v) + '%',
            of: r => { const f = firOf([r]); return f ? f.pct : null; }, zero: true,
            note: 'fairways from the tee' },
};

function trendChart(rounds, key, VW = W_HALF) {
  const m = TREND[key];
  const pts = rounds.map(r => ({ r, v: m.of(r) })).filter(p => p.v != null);
  if (pts.length < 2) return null;

  const PAD_L = 40, PAD_R = 26, TOP = 14, BOT = 26, H = 190;
  const W = VW - PAD_L - PAD_R, PH = H - TOP - BOT;
  const vals = pts.map(p => p.v);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (m.zero) lo = Math.min(lo, 0);
  if (hi === lo) hi = lo + 1;
  const padY = (hi - lo) * 0.12;
  lo -= padY; hi += padY;
  const X = i => PAD_L + (pts.length === 1 ? W / 2 : W * i / (pts.length - 1));
  const Y = v => TOP + PH * (1 - (v - lo) / (hi - lo));

  let out = `<svg viewBox="0 0 ${VW} ${H}" role="img"
    aria-label="${esc(m.label)} by round, oldest first">`;
  for (let g = 0; g <= 3; g++) {                 // four hairlines, solid, recessive
    const v = lo + (hi - lo) * g / 3, y = Y(v);
    out += `<line class="gl" x1="${PAD_L}" y1="${y.toFixed(1)}" x2="${VW - PAD_R}" y2="${y.toFixed(1)}"/>`;
    out += `<text x="${PAD_L - 8}" y="${(y + 3.5).toFixed(1)}" text-anchor="end">${m.axis(v)}</text>`;
  }
  out += `<path class="ln" d="${pts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join('')}"/>`;

  pts.forEach((p, i) => {
    const x = X(i), y = Y(p.v), a = agg(p.r.plays);
    // The hit area is the whole column, so the target is nowhere near 8px.
    out += `<rect class="hit" x="${(x - W / pts.length / 2).toFixed(1)}" y="${TOP}"
      width="${(W / pts.length).toFixed(1)}" height="${PH}"
      data-tip="<b>${esc(dateTxt(p.r.date))}</b><br>${esc(m.label)} ${m.fmt(p.v)} · ${
      a.n} holes · ${a.strokes} strokes (${sgn(a.strokes - a.par, 0)})"/>`;
    out += `<circle class="dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4"/>`;
    // Dates get crowded past a dozen rounds; thin them rather than overlap.
    if (pts.length <= 8 || i % Math.ceil(pts.length / 7) === 0 || i === pts.length - 1)
      out += `<text x="${x.toFixed(1)}" y="${H - 8}" text-anchor="middle">${esc(dateShort(p.r.date))}</text>`;
  });
  // Direct-label the latest — the one point the reader is looking for.
  const last = pts[pts.length - 1];
  out += `<text class="val" x="${(X(pts.length - 1) + 8).toFixed(1)}" y="${(Y(last.v) + 3.5).toFixed(1)}"
    >${m.fmt(last.v)}</text>`;
  return out + '</svg>';
}

/* ── Hole difficulty ────────────────────────────────────────────────────────
   Magnitude, one hue. Bars grow off a par baseline, so a hole you are under on
   hangs below it. */
function holeChart(plays, sort, VW = W_FULL) {
  const by = new Map();
  for (const p of plays) {
    if (!by.has(p.num)) by.set(p.num, { num: p.num, par: p.par, si: p.si, list: [] });
    by.get(p.num).list.push(p);
  }
  let rows = [...by.values()].map(h => ({
    ...h,
    n: h.list.length,
    avg: h.list.reduce((a, p) => a + p.toPar, 0) / h.list.length,
    best: Math.min(...h.list.map(p => p.score)),
    worst: Math.max(...h.list.map(p => p.score)),
  }));
  if (!rows.length) return null;
  rows.sort(sort === 'hard' ? (a, b) => b.avg - a.avg || a.num - b.num
                            : (a, b) => a.num - b.num);

  const PAD_L = 40, PAD_R = 12, TOP = 16, BOT = 24, H = 200;
  const W = VW - PAD_L - PAD_R, PH = H - TOP - BOT;
  const hi = Math.max(0.6, ...rows.map(r => r.avg));
  const lo = Math.min(0, ...rows.map(r => r.avg));
  const Y = v => TOP + PH * (1 - (v - lo) / (hi - lo));
  const y0 = Y(0);
  const step = W / rows.length, bw = Math.min(34, step - 6);
  const worst = rows.reduce((a, b) => b.avg > a.avg ? b : a, rows[0]);

  let out = `<svg viewBox="0 0 ${VW} ${H}" role="img"
    aria-label="Average strokes over par, by hole">`;
  for (let g = 0; g <= 3; g++) {
    const v = lo + (hi - lo) * g / 3, y = Y(v);
    out += `<line class="gl" x1="${PAD_L}" y1="${y.toFixed(1)}" x2="${VW - PAD_R}" y2="${y.toFixed(1)}"/>`;
    out += `<text x="${PAD_L - 7}" y="${(y + 3.5).toFixed(1)}" text-anchor="end">${sgn(v, 1)}</text>`;
  }
  out += `<line class="ax" x1="${PAD_L}" y1="${y0.toFixed(1)}" x2="${VW - PAD_R}" y2="${y0.toFixed(1)}"/>`;

  rows.forEach((r, i) => {
    const x = PAD_L + i * step + (step - bw) / 2, y = Y(r.avg);
    const tip = `<b>Hole ${r.num}</b> · par ${r.par}${r.si != null ? ` · SI ${r.si}` : ''}<br>`
      + `${sgn(r.avg, 2)} over ${r.n} play${r.n > 1 ? 's' : ''} · best ${r.best}, worst ${r.worst}`;
    out += `<path class="mark" d="${r.avg >= 0 ? capBarV(x, y, bw, y0 - y) : capBarD(x, y0, bw, y - y0)}"
      data-tip="${tip}"/>`;
    out += `<rect class="hit" x="${(PAD_L + i * step).toFixed(1)}" y="${TOP}"
      width="${step.toFixed(1)}" height="${PH}" data-tip="${tip}"/>`;
    out += `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle">${r.num}</text>`;
  });
  // One direct label: the hole that costs the most.
  const wi = rows.indexOf(worst);
  out += `<text class="val" x="${(PAD_L + wi * step + step / 2).toFixed(1)}"
    y="${(Y(worst.avg) - 6).toFixed(1)}" text-anchor="middle">${sgn(worst.avg, 1)}</text>`;
  return out + '</svg>';
}

function holeTable(plays) {
  const by = new Map();
  for (const p of plays) {
    if (!by.has(p.num)) by.set(p.num, { num: p.num, par: p.par, si: p.si, list: [] });
    by.get(p.num).list.push(p);
  }
  const rows = [...by.values()].sort((a, b) => a.num - b.num).map(h => {
    const avg = h.list.reduce((a, p) => a + p.toPar, 0) / h.list.length;
    const gir = h.list.filter(p => p.gir).length;
    return `<tr><td class="n">${h.num}</td><td class="n">${h.par}</td>
      <td class="n" style="color:var(--faint)">${h.si ?? ''}</td>
      <td class="n">${h.list.length}</td>
      <td class="n">${(h.list.reduce((a, p) => a + p.score, 0) / h.list.length).toFixed(2)}</td>
      <td class="n">${sgn(avg, 2)}</td>
      <td class="n">${Math.min(...h.list.map(p => p.score))}</td>
      <td class="n">${pctTxt(gir, h.list.length)}</td></tr>`;
  }).join('');
  return `<table><thead><tr><th class="n">#</th><th class="n">Par</th><th class="n">SI</th>
    <th class="n">Plays</th><th class="n">Avg</th><th class="n">To par</th>
    <th class="n">Best</th><th class="n">GIR</th></tr></thead><tbody>${rows}</tbody></table>`;
}

/* ── Score matrix ───────────────────────────────────────────────────────────
   The chart and the table at once: every cell carries its own number, and the
   colour only says how far from par it was. */
function scoreMatrix(rounds) {
  const nums = COURSE.holes.map(h => h.num);
  const head = nums.map(n => `<th>${n}</th>`).join('');
  const body = rounds.slice().reverse().map(r => {
    const at = new Map(r.plays.map(p => [p.num, p]));
    const a = agg(r.plays);
    const cells = nums.map(n => {
      const p = at.get(n);
      if (!p) return `<td title="not played">·</td>`;
      const b = bucket(p.score, p.par);
      return `<td style="background:${vv(SCORE_VAR[b])};color:${vv(SCORE_VAR[b] + '-ink')}"
        data-tip="<b>Hole ${n}</b> · par ${p.par}<br>${p.score} strokes (${sgn(p.toPar, 0)}) · ${
        p.putts} putt${p.putts === 1 ? '' : 's'}${p.gir ? ' · green in regulation' : ''}"
        >${p.score}</td>`;
    }).join('');
    return `<tr><th class="rh">${esc(dateShort(r.date))}</th>${cells}
      <td style="background:transparent;color:var(--text)">${sgn(a.strokes - a.par, 0)}</td></tr>`;
  }).join('');
  return `<div class="gwrap"><table class="grid">
    <thead><tr><th class="rh">Hole</th>${head}<th>±</th></tr></thead>
    <tbody>${body}</tbody></table></div>`;
}

/* ── Club distances ─────────────────────────────────────────────────────────
   What a club actually goes, not what it is supposed to: the middle half of
   every strike, with the median marked. One hue — these are one measure. */
function clubChart(clubs, VW = W_FULL) {
  if (!clubs.length) return null;
  const R = 18, GAP = 8, PAD_L = 66, PAD_R = 62, TOP = 18, BOT = 24;
  const H = TOP + clubs.length * (R + GAP) + BOT;
  const W = VW - PAD_L - PAD_R;
  const hi = Math.max(...clubs.map(c => c.max)) * 1.02;
  const X = m => PAD_L + W * m / hi;

  let out = `<svg viewBox="0 0 ${VW} ${H}" role="img"
    aria-label="Distance by club: middle half of strikes, with the median">`;
  const stepM = hi > 220 ? 50 : hi > 90 ? 25 : 10;
  for (let m = 0; m <= hi; m += stepM) {
    out += `<line class="gl" x1="${X(m).toFixed(1)}" y1="${TOP - 4}" x2="${X(m).toFixed(1)}" y2="${H - BOT + 2}"/>`;
    out += `<text x="${X(m).toFixed(1)}" y="${H - 7}" text-anchor="middle">${disp(m).toFixed(0)}</text>`;
  }
  clubs.forEach((c, i) => {
    const y = TOP + i * (R + GAP);
    const x0 = X(c.p25), x1 = X(c.p75), xm = X(c.p50), xx = X(c.max);
    const tip = `<b>${esc(c.club)}</b> — ${c.n} strike${c.n === 1 ? '' : 's'}${
      c.tee ? `, ${c.tee} off the tee` : ''}<br>median ${fmt(c.p50)} · middle half ${
      fmt(c.p25)}–${fmt(c.p75)} · longest ${fmt(c.max)}`;
    out += `<text x="${PAD_L - 9}" y="${y + R / 2 + 3.5}" text-anchor="end" class="val">${esc(c.short)}</text>`;
    // The reach out to the longest strike, then the middle half over it.
    out += `<rect x="${x1.toFixed(1)}" y="${(y + R / 2 - 1).toFixed(1)}"
      width="${Math.max(0, xx - x1).toFixed(1)}" height="2" fill="${vv('--viz-soft')}" opacity=".7"/>`;
    out += `<rect class="soft" x="${x0.toFixed(1)}" y="${y}" width="${Math.max(2, x1 - x0).toFixed(1)}"
      height="${R}" rx="4"/>`;
    out += `<rect class="mark" x="${(xm - 1).toFixed(1)}" y="${y - 2}" width="2.4" height="${R + 4}" rx="1"/>`;
    out += `<rect class="hit" x="${PAD_L}" y="${y - GAP / 2}" width="${W}" height="${R + GAP}" data-tip="${tip}"/>`;
    out += `<text class="val" x="${VW - PAD_R + 7}" y="${y + R / 2 + 3.5}">${fmt(c.p50)}</text>`;
    out += `<text x="${VW - PAD_R + 7}" y="${y + R / 2 + 13}">${c.n}×</text>`;
  });
  out += `<text x="${PAD_L}" y="${8}">${unit()} carried and rolled</text>`;
  return out + '</svg>';
}

function clubTable(clubs) {
  return `<table><thead><tr><th>Club</th><th class="n">Strikes</th><th class="n">Median</th>
    <th class="n">25th</th><th class="n">75th</th><th class="n">Longest</th></tr></thead><tbody>${
    clubs.map(c => `<tr><td>${esc(c.club)}</td><td class="n">${c.n}</td>
      <td class="n">${fmt(c.p50)}</td><td class="n">${fmt(c.p25)}</td>
      <td class="n">${fmt(c.p75)}</td><td class="n">${fmt(c.max)}</td></tr>`).join('')
  }</tbody></table>`;
}

/* ── Where the ball ends up ─────────────────────────────────────────────────
   A grid of counts, so it is a sequential scale: one hue, light where nothing
   happened. Each cell keeps its number, which is also the table view. */
function lieGrid(mx) {
  if (!mx.rows.length) return '<p class="foot">No lies recorded.</p>';
  const peak = Math.max(...mx.rows.flatMap(r => mx.cols.map(c => mx.at(r, c))));
  const step = v => v === 0 ? 0 : Math.min(5, 1 + Math.floor(4 * (v - 1) / Math.max(1, peak - 1)));
  const head = mx.cols.map(c => `<th>${esc(lieName(c))}</th>`).join('');
  const body = mx.rows.map(r => {
    const tot = mx.sum(r);
    return `<tr><th class="rh">${esc(lieName(r))}</th>${mx.cols.map(c => {
      const v = mx.at(r, c), s = step(v);
      return `<td style="background:${vv('--heat-' + s)};color:${vv('--heat-' + s + '-ink')}"
        data-tip="<b>${v}</b> shot${v === 1 ? '' : 's'} from ${esc(lieName(r).toLowerCase())} to ${
        esc(lieName(c).toLowerCase())} — ${pctTxt(v, tot)} of shots from there">${v || '·'}</td>`;
    }).join('')}<td style="background:transparent;color:var(--muted)">${tot}</td></tr>`;
  }).join('');
  return `<div class="gwrap"><table class="grid">
    <thead><tr><th class="rh">from ↓ &nbsp;to →</th>${head}<th>All</th></tr></thead>
    <tbody>${body}</tbody></table></div>`;
}

/* ── Putting ────────────────────────────────────────────────────────────── */
function puttChart(plays, VW = W_HALF) {
  const bins = [0, 0, 0, 0, 0];                  // 0, 1, 2, 3, 4+
  for (const p of plays) bins[Math.min(4, p.putts)]++;
  const total = plays.length || 1;
  const PAD_L = 32, PAD_R = 10, TOP = 18, BOT = 24, H = 172;
  const W = VW - PAD_L - PAD_R, PH = H - TOP - BOT;
  const hi = Math.max(1, ...bins);
  const step = W / bins.length, bw = Math.min(64, step - 14);
  const labels = ['0', '1', '2', '3', '4+'];

  let out = `<svg viewBox="0 0 ${VW} ${H}" role="img" aria-label="Holes by number of putts">`;
  for (let g = 0; g <= 2; g++) {
    const y = TOP + PH * (1 - g / 2);
    out += `<line class="gl" x1="${PAD_L}" y1="${y.toFixed(1)}" x2="${VW - PAD_R}" y2="${y.toFixed(1)}"/>`;
    out += `<text x="${PAD_L - 7}" y="${(y + 3.5).toFixed(1)}" text-anchor="end">${Math.round(hi * g / 2)}</text>`;
  }
  bins.forEach((v, i) => {
    const h = PH * v / hi, x = PAD_L + i * step + (step - bw) / 2, y = TOP + PH - h;
    const tip = `<b>${v}</b> hole${v === 1 ? '' : 's'} with ${labels[i]} putt${
      i === 1 ? '' : 's'} — ${pctTxt(v, total)}`;
    if (v) out += `<path class="mark" d="${capBarV(x, y, bw, h)}" data-tip="${tip}"/>`;
    out += `<rect class="hit" x="${(PAD_L + i * step).toFixed(1)}" y="${TOP}" width="${step.toFixed(1)}"
      height="${PH}" data-tip="${tip}"/>`;
    out += `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle">${labels[i]} putt${
      i === 1 ? '' : 's'}</text>`;
    if (v) out += `<text class="val" x="${(x + bw / 2).toFixed(1)}" y="${(y - 6).toFixed(1)}"
      text-anchor="middle">${v}</text>`;
  });
  return out + '</svg>';
}

/* ── The tab ────────────────────────────────────────────────────────────── */
const VIZ = { trend: 'toPar', holeSort: 'num' };

function renderStats() {
  const el = document.getElementById('stats');
  const A = analysis();
  CARD_SEQ = 0;

  if (!A.plays.length) {
    el.innerHTML = `<p class="note">No scored rounds on this course yet.</p>`;
    return;
  }

  const plays = scopedPlays(), rounds = scopedRounds();
  const a = agg(plays), fir = firOf(rounds);
  const clubs = clubStats(plays);
  const mx = lieMatrix(plays);
  const one = S.round !== 'all';

  /* One filter row, above everything it scopes. */
  const opts = [`<option value="all"${one ? '' : ' selected'}>All ${A.rounds.length} round${
    A.rounds.length === 1 ? '' : 's'}</option>`]
    .concat(A.rounds.slice().reverse().map(r => {
      const ra = agg(r.plays);
      return `<option value="${r.id}"${+S.round === r.id ? ' selected' : ''}>${
        esc(dateTxt(r.date))} · ${ra.n} holes · ${sgn(ra.strokes - ra.par, 0)}</option>`;
    })).join('');

  const filter = `<div class="sfilter">
    <span class="lbl">Rounds</span>
    <select id="anRound" aria-label="Which rounds to analyse">${opts}</select>
    <span class="grow"></span>
    <span class="lbl">${a.n} holes · ${a.strokes} strokes</span>
  </div>`;

  /* The headline is scoring, normalised per 18 — half these rounds are nine
     holes or fewer, and a round total would compare a front nine with a full
     eighteen. */
  const per18 = a.toParPerHole * 18;
  const kpi = (v, sub, cls = '') =>
    `<div class="kpi ${cls}"><div class="v">${v}</div><div class="sub">${sub}</div></div>`;
  const kpis = `<div class="kpis">
    ${kpi(sgn(per18, 1), 'to par per 18 holes', 'hero')}
    ${kpi(`${rounds.length}<small> / ${a.n} holes</small>`, one ? 'round' : 'rounds played')}
    ${kpi(a.puttsPerHole.toFixed(2), `putts per hole · ${(a.puttsPerHole * 18).toFixed(1)} per 18`)}
    ${kpi(fir ? Math.round(fir.pct) + '%' : '—', fir ? `fairways · ${fir.hit} of ${fir.n}` : 'fairways')}
    ${kpi(pctTxt(a.gir, a.n), `greens in regulation · ${a.gir} of ${a.n}`)}
    ${kpi(pctTxt(a.scr, a.scrN), `scrambled · ${a.scr} of ${a.scrN} missed greens`)}
  </div>`;

  /* Scoring mix, all holes and then by par — each row centred on its own par. */
  const mixRow = (label, list) => ({ label, n: list.length, mix: agg(list).mix });
  const mixRows = [mixRow('All holes', plays)];
  for (const par of [3, 4, 5]) {
    const list = plays.filter(p => p.par === par);
    if (list.length) mixRows.push(mixRow(`Par ${par}`, list));
  }
  const mixTable = `<table><thead><tr><th></th><th class="n">Holes</th>${
    SCORE_SHORT.map(s => `<th class="n">${s}</th>`).join('')}</tr></thead><tbody>${
    mixRows.map(r => `<tr><td>${r.label}</td><td class="n">${r.n}</td>${
      r.mix.map(c => `<td class="n">${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;

  const cards = [];
  cards.push(chartCard({
    title: 'How you score', sub: 'share of holes, centred on par',
    plot: mixChart(mixRows), table: mixTable, keys: scoreKeys(),
    foot: `${a.mix[2] + a.mix[1] + a.mix[0]} of ${a.n} holes at par or better.`,
  }));

  const trend = one ? null : trendChart(A.rounds, VIZ.trend);
  const trendTable = `<table><thead><tr><th>Round</th><th class="n">Holes</th><th class="n">Strokes</th>
    <th class="n">To par</th><th class="n">Putts</th><th class="n">GIR</th><th class="n">FIR</th>
    </tr></thead><tbody>${A.rounds.slice().reverse().map(r => {
      const ra = agg(r.plays), rf = firOf([r]);
      return `<tr><td>${esc(dateShort(r.date))}</td><td class="n">${ra.n}</td>
        <td class="n">${ra.strokes}</td><td class="n">${sgn(ra.strokes - ra.par, 0)}</td>
        <td class="n">${ra.putts}</td><td class="n">${pctTxt(ra.gir, ra.n)}</td>
        <td class="n">${rf ? Math.round(rf.pct) + '%' : '—'}</td></tr>`;
    }).join('')}</tbody></table>`;
  cards.push(chartCard({
    title: 'Round by round', sub: TREND[VIZ.trend].note,
    tabs: Object.entries(TREND).map(([k, v]) => ({ v: 'trend:' + k, label: v.label, on: VIZ.trend === k })),
    plot: trend || `<p class="foot">${one
      ? 'One round selected — pick “all rounds” to see the trend.'
      : 'A trend needs at least two rounds here.'}</p>`,
    table: trendTable,
    foot: 'Per hole, so a nine-hole round sits beside a full eighteen honestly.',
  }));

  cards.push(chartCard({
    title: 'Which holes cost you', sub: 'average strokes over par',
    tabs: [{ v: 'holeSort:num', label: 'By hole', on: VIZ.holeSort === 'num' },
           { v: 'holeSort:hard', label: 'Hardest', on: VIZ.holeSort === 'hard' }],
    plot: holeChart(plays, VIZ.holeSort, W_FULL) || '', table: holeTable(plays),
  }));

  cards.push(chartCard({
    title: 'Every hole, every round', sub: 'newest round first',
    plot: scoreMatrix(rounds), keys: scoreKeys(),
    foot: 'The last column is that round’s score against par.',
  }));

  cards.push(chartCard({
    title: 'What each club goes', sub: 'middle half of strikes, median marked',
    plot: clubChart(clubs, W_FULL) || '<p class="foot">No distances recorded.</p>',
    table: clubTable(clubs),
    foot: `Putts and drops are left out — ${clubs.reduce((n, c) => n + c.n, 0)} strikes counted.`,
  }));

  cards.push(chartCard({
    title: 'Where the ball ends up', sub: 'shots from each lie, by what they found',
    plot: lieGrid(mx),
    foot: 'Read a row: of every shot you played from there, where it finished.',
  }));

  cards.push(chartCard({
    title: 'Putting', sub: `${a.one} one-putts · ${a.three} three-putts or worse`,
    plot: puttChart(plays),
    foot: `${pctTxt(a.three, a.n)} of holes cost three putts or more.`,
  }));

  el.innerHTML = filter + kpis
    + `<div class="srow wide">${cards[0]}${cards[1]}</div>`
    + cards[2] + cards[3] + cards[4]
    + `<div class="srow wide">${cards[5]}${cards[6]}</div>`;

  document.getElementById('anRound').onchange = e => { S.round = e.target.value; renderStats(); };
  el.querySelectorAll('[data-tv]').forEach(b => b.onclick = () => {
    const on = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', on);
    b.closest('.card2').classList.toggle('as-table', on);
  });
  el.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => {
    const [k, v] = b.dataset.opt.split(':');
    VIZ[k] = v;
    renderStats();
  });
}

/* One tooltip for the whole tab. Hover enhances; it never carries a value that
   is not also in the card's table view. */
{
  const tip = document.getElementById('tip');
  let cur = null;
  const hide = () => { if (cur) { tip.classList.remove('on'); cur = null; } };
  document.addEventListener('pointermove', e => {
    const el = e.target.closest?.('[data-tip]');
    if (!el) return hide();
    if (el !== cur) { cur = el; tip.innerHTML = el.dataset.tip; }
    tip.style.left = e.clientX + 'px';
    tip.style.top = Math.max(28, e.clientY - 12) + 'px';
    tip.classList.add('on');
  }, { passive: true });
  document.addEventListener('pointerdown', hide, { passive: true });
  addEventListener('blur', hide);
  document.getElementById('stats').addEventListener('scroll', hide, { passive: true });
}

/* ══ Library ════════════════════════════════════════════════════════════════
   The front door with nothing loaded, and the course switcher afterwards. The
   card is built from the manifest alone, so searching never waits on a course
   download. */
const LIB = APP.library || [];
const CACHE = new Map();

/* A round-by-round trace of scoring, small enough to sit on a card. */
function spark(m) {
  const played = (m.rounds || []).filter(r => r.holes);
  if (!played.length) return '';
  const W = 104, H = 24, vals = played.map(r => r.toPar / r.holes);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const Y = v => H - 3 - (H - 6) * (hi === lo ? .5 : (v - lo) / (hi - lo));
  const X = i => vals.length === 1 ? W / 2 : W * i / (vals.length - 1);
  const d = vals.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join('');
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">
    ${vals.length > 1 ? `<path d="${d}" fill="none" stroke="var(--viz)" stroke-width="1.6"
      stroke-linejoin="round"/>` : ''}
    <circle cx="${X(vals.length - 1).toFixed(1)}" cy="${Y(vals[vals.length - 1]).toFixed(1)}"
      r="2.6" fill="var(--viz)"/></svg>`;
}

function libCard(m) {
  const played = (m.rounds || []).filter(r => r.holes).length;
  const on = COURSE && COURSE.courseID === m.id;
  const tag = (s, i = '') => `<span class="tag">${i}${s}</span>`;
  const num = (v, l) => `<div><span class="v">${v}</span><span class="lbl">${l}</span></div>`;
  return `<button class="cc${on ? ' on' : ''}" data-id="${m.id}">
    <div>
      <h3>${esc(m.name.replace(/ Championship$/, ''))}</h3>
      <div class="where">${m.holes} holes · par ${m.par}${
        m.first ? ` · ${esc(dateShort(m.first))} – ${esc(dateShort(m.last))}` : ''}</div>
    </div>
    <div class="nums">
      ${num(played, played === 1 ? 'round' : 'rounds')}
      ${num(m.toParPerHole == null ? '—' : sgn(m.toParPerHole * 18, 1), 'per 18')}
      ${num(m.puttsPerHole == null ? '—' : m.puttsPerHole.toFixed(2), 'putts/hole')}
      ${num(m.gir == null ? '—' : Math.round(m.gir) + '%', 'greens')}
    </div>
    <div class="foot">
      ${(m.tees || []).slice(0, 5).map(t => tag(esc(t),
         `<i style="background:${teeColor(t) || 'var(--line)'}"></i>`)).join('')}
      ${m.hasCard ? tag('card') : ''}${m.hasSat ? tag('aerial') : ''}
      ${spark(m)}
    </div>
  </button>`;
}

function renderLib(q = '') {
  const needle = q.trim().toLowerCase();
  const hits = !needle ? LIB.slice() : LIB
    .map(m => {
      const hay = [m.name, String(m.id), m.player || '', ...(m.tees || [])].join(' ').toLowerCase();
      return { m, at: hay.indexOf(needle) };
    })
    .filter(x => x.at >= 0)
    .sort((a, b) => a.at - b.at || a.m.name.localeCompare(b.m.name))
    .map(x => x.m);

  document.getElementById('libCount').textContent =
    needle ? `${hits.length} of ${LIB.length}` : `${LIB.length} loaded`;
  document.getElementById('libCards').innerHTML = hits.length
    ? hits.map(libCard).join('')
    : `<p class="none">Nothing here matches “${esc(q)}”. Scrape another course with
       <code>python courses.py --course &lt;id&gt;</code>, then rebuild.</p>`;
  document.querySelectorAll('#libCards .cc').forEach(b =>
    b.onclick = () => openCourse(+b.dataset.id));
  LIB_HITS = hits;
}
let LIB_HITS = [];

function openLib() {
  document.getElementById('lib').hidden = false;
  const f = document.getElementById('libFind');
  renderLib(f.value);
  f.focus(); f.select();
}
function closeLib() {
  if (!COURSE) return;                 // nothing behind it yet
  document.getElementById('lib').hidden = true;
}

/* ══ Loading a course ═══════════════════════════════════════════════════════
   Baked in for the standalone build, fetched for the served one. Either way it
   lands in the same cache, so switching back is instant. */
async function openCourse(id, opts = {}) {
  const m = LIB.find(x => x.id === +id);
  if (!m) return;
  if (COURSE && COURSE.courseID === +id && !opts.force) { closeLib(); return; }

  const hint = document.getElementById('libHint');
  let data = CACHE.get(String(id)) || (APP.courses || {})[String(id)];
  if (!data) {
    hint.textContent = `Loading ${m.name}…`;
    try {
      const res = await fetch((APP.base || 'data/') + m.file);
      if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
      data = await res.json();
    } catch (err) {
      // Opening the served build straight off the disk is the usual cause:
      // file:// pages are not allowed to read a sibling file.
      hint.innerHTML = `<b>Could not load ${esc(m.name)}.</b> ${esc(String(err.message || err))}<br>`
        + (location.protocol === 'file:'
          ? `This build reads its courses from <code>data/</code>, which a page opened
             from disk may not do. Serve it —
             <code>python -m http.server -d ${esc((APP.base || 'data/').replace(/data\/$/, '') || '.')} 8000</code>
             — or build the single-file version:
             <code>python build_app.py --standalone</code>.`
          : `Check that <code>${esc((APP.base || 'data/') + m.file)}</code> is being served.`);
      return;
    }
  }
  CACHE.set(String(id), data);
  hint.textContent = '';

  COURSE = data;
  initCourse();

  // A fresh course means a fresh framing, tee set and analysis scope.
  Object.assign(S, {
    view: 'course', hole: 0, measure: null, cursor: null,
    teeSet: PLAYED_TEE || CARD_TEES[0] || null, teeIdx: 0,
    sat: false, round: 'all', zoom: 1, pan: { x: 0, y: 0 },
  });
  document.getElementById('tgSat').setAttribute('aria-pressed', false);
  syncCourseChrome();
  setTab(opts.tab || 'map');
  document.getElementById('lib').hidden = true;
  if (!opts.keepHash) writeHash();
  return data;
}

/* Header, tee picker and unit default all belong to the course, so they are
   rebuilt whenever one loads. */
function syncCourseChrome() {
  const name = COURSE.name.replace(/ Championship$/, '');
  document.title = name + ' — Golf Stats';
  document.getElementById('courseName').textContent = name;
  document.getElementById('courseSub').textContent =
    `${COURSE.holes.length} holes · par ${COURSE.holes.reduce((a, h) => a + h.par, 0)}`
    + ` · ${analysis().rounds.length} round${analysis().rounds.length === 1 ? '' : 's'}`;

  const seg = document.getElementById('teeSeg');
  if (CARD_TEES.length > 1) {
    seg.hidden = false;
    seg.innerHTML = CARD.tees.map(t =>
      `<button data-set="${esc(t.name)}" title="${esc(t.name)} tees${
        t.code != null ? ` (${t.code})` : ''} — ${t.total} ${CARD.units || 'm'}${
        t.name === PLAYED_TEE ? ', the set you played' : ''}">
        <i style="background:${teeColor(t.name) || 'var(--line)'}"></i>${esc(t.name)}</button>`).join('');
    seg.querySelectorAll('button').forEach(b => b.onclick = () => setTeeSet(b.dataset.set));
    syncTeeSeg();
    S.teeIdx = teeIdxOfSet(COURSE.holes[S.hole]);
  } else {
    seg.hidden = true; seg.innerHTML = '';
  }

  document.getElementById('satRow').hidden = !HAS_SAT;
  document.getElementById('bookBtn').disabled = false;
  setUnits(COURSE.usingYards ? 'yd' : 'm');
  showZoom();
}

/* ── Routing ────────────────────────────────────────────────────────────────
   `#20625`, `#20625/analysis`, `#20625/book=A5,2` — so a course, a tab, or a
   whole printed book is one link. */
function writeHash() {
  if (!COURSE) return;
  const h = '#' + COURSE.courseID + (S.tab === 'stats' ? '/analysis' : '');
  if (location.hash !== h) history.replaceState(null, '', h);
}

function readHash() {
  const parts = decodeURIComponent(location.hash.slice(1)).split('/').filter(Boolean);
  const out = { id: null, tab: null, book: null };
  for (const p of parts) {
    if (/^\d+$/.test(p)) out.id = +p;
    else if (/^book/.test(p)) out.book = p.split('=')[1] || '';
    else if (/^(analysis|stats)$/.test(p)) out.tab = 'stats';
    else if (p === 'map') out.tab = 'map';
  }
  return out;
}

/* ── Boot ─────────────────────────────────────────────────────────────────── */
{
  const f = document.getElementById('libFind');
  f.addEventListener('input', () => renderLib(f.value));
  f.addEventListener('keydown', e => {
    if (e.key === 'Enter' && LIB_HITS.length) openCourse(LIB_HITS[0].id);
  });
  document.getElementById('brandBtn').onclick = openLib;
  document.getElementById('libHint').innerHTML =
    `Every course scraped to disk shows up here — add one with
     <code>python courses.py --course &lt;id&gt;</code>, then
     <code>python build_app.py</code>. Press <code>/</code> at any time to come back,
     <code>a</code> for the analysis, <code>b</code> for the yardage book.`;
  renderLib();
  syncBookBar();
  setPageCSS();
}

(async () => {
  const want = readHash();
  // One course in the library and no route asked for: open it rather than
  // making you click through a list of one.
  const id = want.id ?? (LIB.length === 1 ? LIB[0].id : null);
  if (id == null) { openLib(); return; }

  await openCourse(id, { tab: want.tab || 'map', keepHash: want.book != null });
  if (!COURSE) { openLib(); return; }

  if (want.book != null) {
    for (const arg of want.book.split(',').filter(Boolean)) {
      if (PAGES[arg]) { BOOK.size = arg; BOOK.margin = PAGES[arg].m; }
      else if (CARD_TEES.includes(arg)) { S.teeSet = arg; syncTeeSeg(); }
      else if (BOOK_UP[arg]) BOOK.per = +arg;
      else if (arg === 'grey' || arg === 'gray') BOOK.gray = true;
      else if (arg === 'top') BOOK.top = true;
    }
    syncBookBar();
    openBook();
  }
})();

</script>
